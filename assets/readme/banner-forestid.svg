<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="ForestID — Inventario forestal con QR, GPS y trazabilidad">
  <title>ForestID — Sistema de Identificación y Gestión del Inventario Forestal</title>
  <desc>Banner animado: amanecer sobre el bosque con sol pulsante, hojas flotando y luciérnagas.</desc>

  <defs>
    <clipPath id="clipCard">
      <rect x="0" y="0" width="1200" height="400" rx="28"/>
    </clipPath>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05271C">
        <animate attributeName="stop-color" values="#05271C;#0A3826;#05271C" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#0C4430"/>
      <stop offset="100%" stop-color="#15583E"/>
    </linearGradient>

    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#F2B632" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F2B632" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunDisc" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF6D8"/>
      <stop offset="60%" stop-color="#F2B632"/>
      <stop offset="100%" stop-color="#E9A22E"/>
    </radialGradient>

    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2B632"/>
      <stop offset="100%" stop-color="#E9A22E" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- Árbol de copa redonda -->
    <g id="treeRound">
      <rect x="-3.5" y="-16" width="7" height="20" rx="3" fill="#3B2716"/>
      <circle cx="-14" cy="-22" r="14" fill="#0C4A32"/>
      <circle cx="14" cy="-22" r="14" fill="#0C4A32"/>
      <circle cx="0" cy="-34" r="19" fill="#0E5237"/>
      <circle cx="2" cy="-24" r="15" fill="#10603F"/>
    </g>

    <!-- Árbol tipo conífera -->
    <g id="treePine">
      <rect x="-3" y="-14" width="6" height="18" rx="2.5" fill="#3B2716"/>
      <path d="M0 -60 L 15 -36 H -15 Z" fill="#0D5739"/>
      <path d="M0 -44 L 19 -18 H -19 Z" fill="#0B4E33"/>
      <path d="M0 -28 L 23 -2 H -23 Z" fill="#09452D"/>
    </g>

    <!-- Arbusto -->
    <g id="shrub">
      <circle cx="-8" cy="-3" r="7" fill="#0C4A32"/>
      <circle cx="8" cy="-3" r="7" fill="#0C4A32"/>
      <circle cx="0" cy="-7" r="9" fill="#0E5237"/>
    </g>
  </defs>

  <g clip-path="url(#clipCard)">

    <!-- Cielo -->
    <rect width="1200" height="400" fill="url(#skyGrad)"/>

    <!-- Sol pulsante con rayos giratorios -->
    <circle cx="1035" cy="105" r="135" fill="url(#sunHalo)" opacity="0.6">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(1035,105)">
      <circle r="68" fill="none" stroke="#F2B632" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="4 31.6" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite"/>
      </circle>
      <circle r="88" fill="none" stroke="#F2B632" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="3 31.56" opacity="0.32">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="180s" repeatCount="indefinite"/>
      </circle>
      <circle r="48" fill="url(#sunDisc)">
        <animate attributeName="r" values="48;51;48" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Nubes a la deriva -->
    <g opacity="0.07">
      <ellipse cx="0" cy="0" rx="95" ry="24" fill="#FFFFFF"/>
      <ellipse cx="62" cy="9" rx="68" ry="17" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="translate" from="-220 82" to="1320 82"
                        dur="90s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.05">
      <ellipse cx="0" cy="0" rx="130" ry="26" fill="#FFFFFF"/>
      <ellipse cx="80" cy="10" rx="90" ry="18" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="translate" from="-280 42" to="1320 42"
                        dur="130s" begin="-40s" repeatCount="indefinite"/>
    </g>

    <!-- Estrellas / destellos -->
    <g transform="translate(700,112)" fill="#FFF3C4">
      <path d="M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z" opacity="0.4">
        <animate attributeName="opacity" values="0.08;0.85;0.08" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(848,58) scale(0.8)" fill="#FFF3C4">
      <path d="M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z" opacity="0.5">
        <animate attributeName="opacity" values="0.08;0.8;0.08" dur="3.4s" begin="-1.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(1148,196) scale(0.7)" fill="#FFF3C4">
      <path d="M0 -9 L2.4 -2.4 L9 0 L2.4 2.4 L0 9 L-2.4 2.4 L-9 0 L-2.4 -2.4 Z" opacity="0.3">
        <animate attributeName="opacity" values="0.05;0.7;0.05" dur="4.1s" begin="-2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Lejanas -->
    <path d="M0 400 V 306 C 150 272, 320 316, 470 298 C 620 280, 760 320, 900 298 C 1030 278, 1130 304, 1200 294 L1200 400 Z"
          fill="#0A3A2A"/>
    <!-- Colinas medias -->
    <path d="M0 400 V 344 C 130 322, 285 356, 435 340 C 585 324, 725 356, 875 342 C 1010 330, 1110 352, 1200 342 L1200 400 Z"
          fill="#0C4831"/>

    <!-- Bosque medio -->
    <use href="#treeRound" transform="translate(812,352) scale(0.9)"/>
    <use href="#treePine"  transform="translate(868,354) scale(1.0)"/>
    <use href="#treeRound" transform="translate(926,352) scale(1.15)"/>
    <use href="#treePine"  transform="translate(984,356) scale(0.85)"/>
    <use href="#treeRound" transform="translate(1040,353) scale(1.0)"/>
    <use href="#treePine"  transform="translate(1094,355) scale(1.1)"/>
    <use href="#treeRound" transform="translate(1150,352) scale(0.95)"/>

    <!-- Banda de primer plano -->
    <path d="M0 400 V 378 C 160 366, 330 386, 500 376 C 680 366, 850 388, 1010 376 C 1110 368, 1160 376, 1200 372 L1200 400 Z"
          fill="#062A1D"/>

    <!-- Bosque cercano -->
    <use href="#treeRound" transform="translate(772,392) scale(1.35)"/>
    <use href="#treePine"  transform="translate(850,394) scale(1.3)"/>
    <use href="#treeRound" transform="translate(940,392) scale(1.5)"/>
    <use href="#treePine"  transform="translate(1032,395) scale(1.25)"/>
    <use href="#treeRound" transform="translate(1124,391) scale(1.4)"/>

    <!-- Arbustos -->
    <use href="#shrub" transform="translate(170,392) scale(1.2)"/>
    <use href="#shrub" transform="translate(302,396) scale(1.0)"/>
    <use href="#shrub" transform="translate(432,390) scale(1.3)"/>
    <use href="#shrub" transform="translate(560,394) scale(1.1)"/>
    <use href="#shrub" transform="translate(662,390) scale(1.2)"/>

    <!-- Luciérnagas -->
    <circle cx="700" cy="330" r="3.5" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="762" cy="302" r="3" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="320" r="3.2" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="-2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="884" cy="290" r="2.8" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="944" cy="318" r="3.4" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1008" cy="300" r="3" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="-2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1074" cy="328" r="3.2" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1142" cy="296" r="2.8" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="-2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="360" r="3" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="366" r="2.6" fill="#FFE082" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="-2.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Texto del título -->
    <text x="70" y="155" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="92"
          font-weight="800" letter-spacing="-1" fill="#F2B632" filter="url(#softGlow)" opacity="0.25">ForestID
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="155" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="92"
          font-weight="800" letter-spacing="-1" fill="#FFFFFF">ForestID</text>

    <!-- Barra ámbar que se dibuja -->
    <rect x="70" y="186" width="0" height="8" rx="4" fill="url(#amberBar)">
      <animate attributeName="width" from="0" to="300" dur="1.2s" begin="0.4s" fill="freeze"/>
    </rect>

    <text x="70" y="240" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="25"
          font-weight="600" fill="#C8E6C9">Sistema de Identificación y Gestión del Inventario Forestal</text>
    <text x="70" y="278" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="18"
          font-weight="500" fill="#A5D6A7">Emincut S.A.S. · El Bagre, Antioquia · SENA iRed Innovacción</text>

    <!-- Hojas flotando -->
    <path d="M0 0 C 2 -8 12 -14 22 -12 C 22 -2 14 6 4 6 C 1 5 0 3 0 0 Z" fill="#A5D6A7" opacity="0.9">
      <animateMotion path="M1230 40 C 1000 130, 860 60, 600 190 S 220 320, -70 300"
                     dur="24s" begin="-2s" rotate="auto" repeatCount="indefinite"/>
    </path>
    <path d="M0 0 C 2 -8 12 -14 22 -12 C 22 -2 14 6 4 6 C 1 5 0 3 0 0 Z" fill="#F2B632" opacity="0.85">
      <animateMotion path="M1240 150 C 980 230, 760 150, 520 260 S 180 360, -80 380"
                     dur="31s" begin="-14s" rotate="auto" repeatCount="indefinite"/>
    </path>
    <path d="M0 0 C 2 -8 12 -14 22 -12 C 22 -2 14 6 4 6 C 1 5 0 3 0 0 Z" fill="#81C784" opacity="0.8">
      <animateMotion path="M1220 250 C 1040 300, 820 240, 560 330 S 200 420, -70 220"
                     dur="27s" begin="-21s" rotate="auto" repeatCount="indefinite"/>
    </path>

  </g>

  <!-- Marco exterior -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="27" fill="none" stroke="#F2B632" stroke-opacity="0.45" stroke-width="3"/>
</svg>
