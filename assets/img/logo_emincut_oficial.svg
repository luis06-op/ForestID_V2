<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%" role="img" aria-label="Emincut — En camino con la minería responsable">
  <!--
    Logo institucional Emincut (recreación vectorial):
    casco de seguridad verde oscuro + sol amarillo + colina verde + tipografía ámbar.
    Paleta: verde casco #35502B · verde colina #5B7C3A · ámbar #E9A22E · amarillo #F2B632
  -->
  <g id="sol">
    <!-- Disco solar -->
    <circle cx="318" cy="118" r="62" fill="#F2B632"/>
    <!-- Puntas onduladas del sol -->
    <g fill="#E9A22E">
      <path d="M318 22 c6 14 -2 22 -8 30 c10 -4 22 -4 30 2 c-4 -12 0 -24 8 -34 c-6 16 -14 20 -22 26 c8 -2 18 0 26 6 c-12 -8 -24 -8 -34 -6 c12 0 22 4 30 12 c-14 -10 -26 -12 -40 -10 c14 -6 22 -14 26 -26z"/>
      <path d="M400 62 c-2 16 -10 20 -20 24 c12 0 20 4 24 14 c-10 -10 -20 -12 -32 -10 c12 4 20 10 24 22 c-12 -12 -22 -16 -36 -16 c16 -4 24 -12 28 -24z"/>
      <path d="M436 140 c-10 10 -18 10 -30 10 c10 6 14 14 14 26 c-6 -14 -14 -20 -26 -24 c12 4 24 4 32 12 c-14 -4 -24 -10 -32 -20 c14 6 26 6 38 4z"/>
      <path d="M412 214 c-12 6 -20 4 -30 0 c8 10 8 18 4 30 c-2 -14 -8 -22 -18 -28 c10 8 22 12 28 22 c-14 -8 -26 -10 -36 -16 c16 2 28 -2 40 -12z"/>
    </g>
    <!-- media copa amarilla izquierda (como en el original: el sol asoma a la derecha del casco) -->
    <path d="M256 118 a62 62 0 0 1 62 -62 l0 124 a62 62 0 0 1 -62 -62z" fill="#F2B632" opacity="0"/>
  </g>

  <!-- Casco de seguridad: arco verde oscuro -->
  <path d="M118 250
           C 108 150, 168 68, 258 62
           C 340 57, 392 110, 396 186"
        fill="none" stroke="#35502B" stroke-width="26" stroke-linecap="round"/>

  <!-- Colina / horizonte verde -->
  <path d="M78 258
           C 170 226, 330 232, 428 276
           C 360 322, 250 336, 168 314
           C 128 304, 96 284, 78 258 Z"
        fill="#5B7C3A"/>

  <!-- Tipografía -->
  <text x="260" y="382" text-anchor="middle"
        font-family="'Michroma', 'Arial Black', 'Arial', sans-serif"
        font-size="64" font-weight="700" fill="#E9A22E" letter-spacing="2">Emincut</text>
  <text x="260" y="410" text-anchor="middle"
        font-family="'Chakra Petch', 'Trebuchet MS', sans-serif"
        font-size="15.5" font-weight="700" fill="#141414" letter-spacing="0.5">En camino con la minería responsable</text>
</svg>
