<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="emincutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Botanical Emblem -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="2"/>
    <!-- Tree Trunk / Stem -->
    <path d="M30 46 V 26" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round" />
    <!-- Stylized Canopy / Leaves -->
    <path d="M30 14 C 20 18, 16 28, 24 36 C 28 32, 30 26, 30 14 Z" fill="url(#leafGrad)" opacity="0.95"/>
    <path d="M30 14 C 40 18, 44 28, 36 36 C 32 32, 30 26, 30 14 Z" fill="url(#emincutGrad)" />
    <circle cx="30" cy="20" r="3" fill="#A5D6A7" />
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Poppins', 'Inter', sans-serif" font-weight="800" font-size="26" fill="#1B5E20" letter-spacing="-0.5">
    Forest<tspan fill="#2E7D32">ID</tspan>
  </text>
  <text x="82" y="56" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#4B5563" letter-spacing="1.2">
    EMINCUT • EL BAGRE
  </text>
</svg>
