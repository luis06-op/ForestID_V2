  - generic [ref=f9e46]:
    - generic [ref=f9e47]:
      - heading "Lo que antes se contaba a mano, ahora queda registrado" [level=2] [ref=f9e48]
      - paragraph [ref=f9e49]: Después de la minería, Emincut debe poder demostrar cuánto sembró y cómo está. ForestID reúne esa información en un solo lugar.
    - list [ref=f9e50]:
      - listitem [ref=f9e51]:
        - generic [ref=f9e54]:
          - heading "Registro de cada árbol" [level=3] [ref=f9e55]
          - paragraph [ref=f9e56]: Especie, fecha de siembra, diámetro, altura y fotos. Cada individuo tiene su ficha y su placa con código QR.
      - listitem [ref=f9e57]:
        - generic [ref=f9e62]:
          - heading "Hectáreas forestadas" [level=3] [ref=f9e63]
          - paragraph [ref=f9e64]: Los árboles se agrupan por zona, para saber qué área ya está sembrada y cuál falta.
      - listitem [ref=f9e65]:
        - generic [ref=f9e70]:
          - heading "Ubicación exacta" [level=3] [ref=f9e71]
          - paragraph [ref=f9e72]: Cada árbol queda georreferenciado en el mapa, con sus coordenadas.
      - listitem [ref=f9e73]:
        - generic [ref=f9e78]:
          - heading "Verificación en campo" [level=3] [ref=f9e79]
          - paragraph [ref=f9e80]: Los operarios revisan el estado de salud y registran riegos, podas y fertilizaciones. Así se sabe cuántos árboles siguen vivos.
      - listitem [ref=f9e81]:
        - generic [ref=f9e84]:
          - heading "Reportes de avance" [level=3] [ref=f9e85]
          - paragraph [ref=f9e86]: Gráficos y cifras del total sembrado, el estado de los árboles y las zonas, listos para presentar.
      - listitem [ref=f9e87]:
        - generic [ref=f9e91]:
          - heading "Información privada" [level=3] [ref=f9e92]
          - paragraph [ref=f9e93]: Solo entra personal autorizado, con usuario y contraseña. Administración y operarios ven lo que les corresponde.
  - generic [ref=f9e95]:
    - heading "Del vivero a la verificación" [level=2] [ref=f9e96]
    - list [ref=f9e97]:
      - listitem [ref=f9e98]:
        - text: "1"
        - heading "Se siembra y se registra" [level=3] [ref=f9e99]
        - paragraph [ref=f9e100]: "El operario registra el árbol en campo: especie, ubicación y medidas iniciales."
      - listitem [ref=f9e101]:
