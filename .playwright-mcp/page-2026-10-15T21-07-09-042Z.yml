  - generic [ref=f5e46]:
    - generic [ref=f5e47]:
      - heading "Lo que antes se contaba a mano, ahora queda registrado" [level=2] [ref=f5e48]
      - paragraph [ref=f5e49]: Después de la minería, Emincut debe poder demostrar cuánto sembró y cómo está. ForestID reúne esa información en un solo lugar.
    - list [ref=f5e50]:
      - listitem [ref=f5e51]:
        - generic [ref=f5e54]:
          - heading "Registro de cada árbol" [level=3] [ref=f5e55]
          - paragraph [ref=f5e56]: Especie, fecha de siembra, diámetro, altura y fotos. Cada individuo tiene su ficha y su placa con código QR.
      - listitem [ref=f5e57]:
        - generic [ref=f5e62]:
          - heading "Hectáreas forestadas" [level=3] [ref=f5e63]
          - paragraph [ref=f5e64]: Los árboles se agrupan por zona, para saber qué área ya está sembrada y cuál falta.
      - listitem [ref=f5e65]:
        - generic [ref=f5e70]:
          - heading "Ubicación exacta" [level=3] [ref=f5e71]
          - paragraph [ref=f5e72]: Cada árbol queda georreferenciado en el mapa, con sus coordenadas.
      - listitem [ref=f5e73]:
        - generic [ref=f5e78]:
          - heading "Verificación en campo" [level=3] [ref=f5e79]
          - paragraph [ref=f5e80]: Los operarios revisan el estado de salud y registran riegos, podas y fertilizaciones. Así se sabe cuántos árboles siguen vivos.
      - listitem [ref=f5e81]:
        - generic [ref=f5e84]:
          - heading "Reportes de avance" [level=3] [ref=f5e85]
          - paragraph [ref=f5e86]: Gráficos y cifras del total sembrado, el estado de los árboles y las zonas, listos para presentar.
      - listitem [ref=f5e87]:
        - generic [ref=f5e91]:
          - heading "Información privada" [level=3] [ref=f5e92]
          - paragraph [ref=f5e93]: Solo entra personal autorizado, con usuario y contraseña. Administración y operarios ven lo que les corresponde.
  - generic [ref=f5e95]:
    - heading "Del vivero a la verificación" [level=2] [ref=f5e96]
    - list [ref=f5e97]:
      - listitem [ref=f5e98]:
        - text: "1"
        - heading "Se siembra y se registra" [level=3] [ref=f5e99]
        - paragraph [ref=f5e100]: "El operario registra el árbol en campo: especie, ubicación y medidas iniciales."
      - listitem [ref=f5e101]:
