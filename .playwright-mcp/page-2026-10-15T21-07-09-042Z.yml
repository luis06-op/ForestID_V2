  - generic [ref=f5e113]:
    - heading "Hecho a la medida de Emincut" [level=2] [ref=f5e114]
    - paragraph [ref=f5e115]: Emincut es una empresa minera legal y certificada de El Bagre, Antioquia. Su reto era contar, sembrar y verificar las hectáreas forestadas después de la minería. ForestID se construyó para resolverlo.
