<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <linearGradient id="hoja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="mangoFruta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  <!-- Grass ground -->
  <path d="M0 320 Q 150 300, 300 320 T 600 320 L 600 400 L 0 400 Z" fill="#4ADE80" opacity="0.8"/>
  <path d="M0 340 Q 200 320, 400 345 T 600 330 L 600 400 L 0 400 Z" fill="#16A34A"/>
  <!-- Trunk and branches -->
  <path d="M288 352 L 294 190 L 262 148 L 276 148 L 298 182 L 318 146 L 332 146 L 306 190 L 314 352 Z" fill="#5D4037"/>
  <!-- Canopy -->
  <circle cx="236" cy="146" r="62" fill="url(#hoja)" opacity="0.95"/>
  <circle cx="364" cy="146" r="62" fill="url(#hoja)" opacity="0.95"/>
  <circle cx="300" cy="104" r="72" fill="url(#hoja)" opacity="0.95"/>
  <circle cx="300" cy="156" r="66" fill="#16A34A" opacity="0.92"/>
  <!-- Hojas claras -->
  <circle cx="258" cy="96" r="22" fill="#86EFAC" opacity="0.55"/>
  <circle cx="352" cy="120" r="18" fill="#86EFAC" opacity="0.45"/>
  <!-- Frutos de mango -->
  <ellipse cx="244" cy="176" rx="15" ry="19" fill="url(#mangoFruta)"/>
  <ellipse cx="330" cy="190" rx="14" ry="18" fill="url(#mangoFruta)"/>
  <ellipse cx="292" cy="128" rx="13" ry="17" fill="url(#mangoFruta)"/>
  <ellipse cx="368" cy="150" rx="12" ry="16" fill="url(#mangoFruta)"/>
  <!-- Badge label -->
  <rect x="20" y="20" width="120" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.9" stroke="#B45309" stroke-width="1.5"/>
  <text x="35" y="44" font-family="'Poppins', sans-serif" font-weight="700" font-size="14" fill="#92400E">Mango</text>
</svg>
